<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AR Life Cycle: Seed, Tree, Wisdom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.4/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.9/dist/aframe-particle-system-component.min.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@5.1.2/dist/aframe-animation-component.min.js"></script>

    <style>
        body, html { margin: 0; overflow: hidden; width: 100%; height: 100%; }
        #statusBox {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 15px;
            border-radius: 10px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="statusBox">
        <p id="narrative-text">Scan the **SEED** marker to begin the cycle. 🌱</p>
    </div>

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        renderer="logarithmicDepthBuffer: true; colorManagement: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="baby-model" src="baby.glb"></a-asset-item>
            <a-asset-item id="adult-model" src=".glb"></a-asset-item>
            <a-asset-item id="elder-model" src="oldman_ernest.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; intensity: 0.5" position="1 1 1"></a-entity>
        <a-entity camera></a-entity>

        <a-nft id="marker-seed" type="nft" url="seed-icon-free-vector">
            <a-entity id="model-baby"
                      gltf-model="#baby-model"
                      scale="50 50 50"
                      position="0 100 0"
                      rotation="90 180 0"
                      animation__rotate="property: rotation; to: 90 540 0; loop: true; dur: 10000; easing: linear"
                      visible="false">
            </a-entity>
            <a-entity id="particles-seed"
                      particle-system="preset: snow; particleCount: 500; color: #1DD300,#81C784; maxAge: 3; size: 0.5; velocityValue: 0 0.5 0;"
                      position="0 100 0"
                      visible="false">
            </a-entity>
            <a-entity id="text-seed"
                      text="value: BIRTH - The beginning of life; align: center; color: #1DD300; width: 800"
                      position="0 -50 0"
                      rotation="-90 0 0"
                      visible="false">
            </a-entity>
        </a-nft>

        <a-nft id="marker-tree" type="nft" url="tree-vector (1)">
            <a-entity id="model-adult"
                      gltf-model="#adult-model"
                      scale="50 50 50"
                      position="0 100 0"
                      rotation="90 180 0"
                      animation__pulse="property: scale; dir: alternate; from: 48 48 48; to: 52 52 52; loop: true; dur: 1500; easing: easeInOutSine"
                      visible="false">
            </a-entity>
            <a-sphere color="#FFD700" radius="5" position="50 150 20"
                      animation__move1="property: position; to: 50 180 20; dir: alternate; loop: true; dur: 2000;"></a-sphere>
            <a-sphere color="#FF4500" radius="5" position="-50 150 -20"
                      animation__move2="property: position; to: -50 180 -20; dir: alternate; loop: true; dur: 2500;"></a-sphere>
            <a-entity id="text-tree"
                      text="value: FLOURISHING - Bearing fruits of labor; align: center; color: #FF8C00; width: 800"
                      position="0 -50 0"
                      rotation="-90 0 0"
                      visible="false">
            </a-entity>
        </a-nft>

        <a-nft id="marker-elder" type="nft" url="old_tree">
            <a-entity id="model-elder"
                      gltf-model="#elder-model"
                      scale="50 50 50"
                      position="0 100 0"
                      rotation="90 180 0"
                      visible="false">
            </a-entity>
            <a-entity id="particles-elder"
                      particle-system="preset: star; particleCount: 300; color: #8B4513,#D2B48C; maxAge: 2; size: 0.8; velocityValue: 0 -0.5 0; rotationAngle: 45;"
                      position="0 150 0"
                      visible="false">
            </a-entity>
            <a-entity id="text-elder"
                      text="value: WISDOM - Seeds of knowledge remain; align: center; color: #8B4513; width: 800"
                      position="0 -50 0"
                      rotation="-90 0 0"
                      visible="false">
            </a-entity>
        </a-nft>

        <a-nft type="nft" url="priza">
            <a-text value="CYCLE COMPLETE: THE PRIZE"
                    align="center"
                    width="400"
                    color="#FFD700"
                    position="0 100 0"
                    rotation="-90 0 0">
            </a-text>
        </a-nft>

    </a-scene>

    <script>
        const statusBox = document.getElementById('statusBox');
        const narrativeText = document.getElementById('narrative-text');

        const markerSeed = document.getElementById('marker-seed');
        const markerTree = document.getElementById('marker-tree');
        const markerElder = document.getElementById('marker-elder');
        
        // Element references for easier visibility toggling
        const elementsSeed = document.getElementById('marker-seed').querySelectorAll('a-entity:not([camera])');
        const elementsTree = document.getElementById('marker-tree').querySelectorAll('a-entity:not([camera])');
        const elementsElder = document.getElementById('marker-elder').querySelectorAll('a-entity:not([camera])');

        let seedScanned = false;
        let treeScanned = false;
        let cycleComplete = false;
        
        // Helper function to set visibility for all children entities of a marker
        function setMarkerVisibility(elements, isVisible) {
            elements.forEach(entity => {
                // Allows models to remain visible if the cycle is complete, even if marker is lost/temporarily hidden.
                if (cycleComplete || isVisible) {
                    entity.setAttribute('visible', 'true');
                } else {
                    entity.setAttribute('visible', 'false');
                }
            });
        }

        // --- 1. SEED Marker (BIRTH) ---
        markerSeed.addEventListener('markerFound', () => {
            setMarkerVisibility(elementsSeed, true);
            if (!seedScanned) {
                seedScanned = true;
                narrativeText.innerHTML = '✅ **BIRTH** scanned! Now look for the **TREE** 🌳.';
            } else if (cycleComplete) {
                narrativeText.innerHTML = 'Cycle is **complete**. Showing **BIRTH** again.';
            }
        });
        markerSeed.addEventListener('markerLost', () => {
            if (!cycleComplete) {
                setMarkerVisibility(elementsSeed, false);
            }
        });

        // --- 2. TREE Marker (FLOURISHING) ---
        markerTree.addEventListener('markerFound', () => {
            if (seedScanned) {
                setMarkerVisibility(elementsTree, true);
                if (!treeScanned) {
                    treeScanned = true;
                    narrativeText.innerHTML = '✅ **FLOURISHING** scanned! The final stage is the **BARE TREE** 🍂.';
                } else if (cycleComplete) {
                    narrativeText.innerHTML = 'Cycle is **complete**. Showing **FLOURISHING** again.';
                }
            } else {
                setMarkerVisibility(elementsTree, false);
                narrativeText.innerHTML = '⚠️ Start with the **SEED** marker first! 🌱';
            }
        });
        markerTree.addEventListener('markerLost', () => {
            if (!cycleComplete) {
                setMarkerVisibility(elementsTree, false);
            }
        });

        // --- 3. BARE TREE Marker (WISDOM) ---
        markerElder.addEventListener('markerFound', () => {
            if (seedScanned && treeScanned) {
                setMarkerVisibility(elementsElder, true);
                if (!cycleComplete) {
                    cycleComplete = true; // Final stage completed!
                    narrativeText.innerHTML = '🎉 **WISDOM** acquired! The **Life Cycle** is **complete**! All scenes are now visible independently.';
                } else {
                    narrativeText.innerHTML = 'Cycle is **complete**. Showing **WISDOM** again.';
                }
            } else if (!seedScanned) {
                setMarkerVisibility(elementsElder, false);
                narrativeText.innerHTML = '⚠️ Start with the **SEED** marker first! 🌱';
            } else { // treeScanned = false
                setMarkerVisibility(elementsElder, false);
                narrativeText.innerHTML = '⚠️ The **TREE** stage must be scanned before this one! 🌳';
            }
        });
        markerElder.addEventListener('markerLost', () => {
            if (!cycleComplete) {
                setMarkerVisibility(elementsElder, false);
            }
        });

        // Initial state: Hide all models and effects
        [...elementsSeed, ...elementsTree, ...elementsElder].forEach(el => el.setAttribute('visible', 'false'));
    </script>
</body>
</html>
