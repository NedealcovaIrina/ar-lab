<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel AR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame & AR.js NFT -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.4/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body, html { margin: 0; overflow: hidden; width: 100%; height: 100%; }
    #statusBox {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="statusBox">Scan the suitcase marker first</div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <!-- Lights -->
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="0 1 1"></a-entity>

    <!-- Suitcase marker -->
    <a-nft id="marker-suitcase" type="nft" url="suitcase-marker">
      <a-entity id="model-suitcase"
                gltf-model="world_map_globe.glb"
                scale="1 1 1"
                position="0 0 0"
                rotation="-90 0 0"
                visible="false"></a-entity>
    </a-nft>

    <!-- Ocean marker -->
    <a-nft id="marker-ocean" type="nft" url="ocean-marker">
      <a-entity id="model-ocean"
                gltf-model="blue_whale.glb"
                scale="1 1 1"
                position="0 0 0"
                rotation="-90 180 0"
                visible="false"></a-entity>
    </a-nft>

    <!-- Tokyo marker -->
    <a-nft id="marker-tokyo" type="nft" url="tokyo-marker">
      <a-entity id="model-tokyo"
                gltf-model="sakura.glb"
                scale="1 1 1"
                position="0 0 0"
                rotation="-90 180 0"
                visible="false"></a-entity>
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const statusBox = document.getElementById('statusBox');
    const markerSuitcase = document.getElementById('marker-suitcase');
    const markerOcean = document.getElementById('marker-ocean');
    const markerTokyo = document.getElementById('marker-tokyo');

    const modelSuitcase = document.getElementById('model-suitcase');
    const modelOcean = document.getElementById('model-ocean');
    const modelTokyo = document.getElementById('model-tokyo');

    let suitcaseScanned = false;
    let oceanScanned = false;

    // --- Suitcase ---
    markerSuitcase.addEventListener('markerFound', () => {
      modelSuitcase.setAttribute('visible', 'true');
      if (!suitcaseScanned) {
        suitcaseScanned = true;
        statusBox.innerHTML = '✅ Suitcase scanned! Now scan the ocean';
      }
    });
    markerSuitcase.addEventListener('markerLost', () => {
      modelSuitcase.setAttribute('visible', 'false');
    });

    // --- Ocean ---
    markerOcean.addEventListener('markerFound', () => {
      if (suitcaseScanned) {
        modelOcean.setAttribute('visible', 'true');
        if (!oceanScanned) {
          oceanScanned = true;
          statusBox.innerHTML = '✅ Ocean scanned! Now scan Tokyo';
        }
      } else {
        statusBox.innerHTML = '⚠️ Scan suitcase first!';
      }
    });
    markerOcean.addEventListener('markerLost', () => {
      modelOcean.setAttribute('visible', 'false');
    });

    // --- Tokyo ---
    markerTokyo.addEventListener('markerFound', () => {
      if (suitcaseScanned && oceanScanned) {
        modelTokyo.setAttribute('visible', 'true');
        statusBox.innerHTML = '🌸 All markers scanned! Journey complete';
      } else if (!oceanScanned) {
        statusBox.innerHTML = '⚠️ Scan ocean before Tokyo';
      }
    });
    markerTokyo.addEventListener('markerLost', () => {
      modelTokyo.setAttribute('visible', 'false');
    });
  </script>
</body>
</html>
